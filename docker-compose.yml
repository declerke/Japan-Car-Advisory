services:

  # ── Car Import Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: car_import_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-car_import_db}
      POSTGRES_USER: ${DB_USER:-caruser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-carpassword}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-caruser} -d ${DB_NAME:-car_import_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Airflow Metadata Database ──────────────────────────────────────────────
  airflow-db:
    image: postgres:15-alpine
    container_name: car_airflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow_meta
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow_meta"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PgAdmin ────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: car_import_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@carimport.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Airflow Init (runs once) ───────────────────────────────────────────────
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: car_airflow_init
    depends_on:
      airflow-db:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow_meta
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow/project
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-car_import_db}
      DB_USER: ${DB_USER:-caruser}
      DB_PASSWORD: ${DB_PASSWORD:-carpassword}
      USD_TO_KES: ${USD_TO_KES:-130.0}
    volumes:
      - .:/opt/airflow/project
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    command: >
      bash -c "airflow db init && airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@japan-car-advisory.dev --password admin || true"
    restart: on-failure

  # ── Airflow Webserver ──────────────────────────────────────────────────────
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: car_airflow_webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow_meta
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      PYTHONPATH: /opt/airflow/project
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-car_import_db}
      DB_USER: ${DB_USER:-caruser}
      DB_PASSWORD: ${DB_PASSWORD:-carpassword}
      USD_TO_KES: ${USD_TO_KES:-130.0}
    ports:
      - "8080:8080"
    volumes:
      - .:/opt/airflow/project
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./data:/opt/airflow/project/data
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Airflow Scheduler ──────────────────────────────────────────────────────
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: car_airflow_scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow_meta
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow/project
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-car_import_db}
      DB_USER: ${DB_USER:-caruser}
      DB_PASSWORD: ${DB_PASSWORD:-carpassword}
      USD_TO_KES: ${USD_TO_KES:-130.0}
    volumes:
      - .:/opt/airflow/project
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./data:/opt/airflow/project/data
    command: scheduler

  # ── Streamlit Dashboard ────────────────────────────────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: car_import_streamlit
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-car_import_db}
      DB_USER: ${DB_USER:-caruser}
      DB_PASSWORD: ${DB_PASSWORD:-carpassword}
      USD_TO_KES: ${USD_TO_KES:-130.0}
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data

volumes:
  postgres_data:
  airflow_db_data:
  airflow_logs:
